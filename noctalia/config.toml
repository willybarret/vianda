[notification]
background_opacity = 0.59999998658895493
layer = "overlay"
position = "bottom_right"

[osd]
background_opacity = 0.59999998658895493
offset_y = 32
position = "bottom_center"

[plugin_settings."icefish/phone-operate"]
battery_display = "percent"
main_open_near_click = false

[plugin_settings."noctalia/wallhaven"]
browser_placement = "floating"
browser_position = "center"

[plugin_settings."thepunkoff/pomodoro"]
long-break-duration = 30
short-break-duration = 10
work-duration = 50

[plugins]
enabled = [ "noctalia/bongocat", "liamwh/emoji-picker", "nightwatch75/file-search", "noctalia/notes", "icefish/phone-operate" ]

[shell]
clipboard_history_max_entries = 3000
corner_radius_scale = 1.6000000238418579
font_family = "SF Pro Display"
niri_overview_type_to_launch_enabled = true
polkit_agent = true
settings_window_translucent = true

    [shell.keyboard_layout.custom_labels]
    "English (Dvorak)" = "Dvorak"
    "English (US)" = "Qwerty"

    [shell.launcher.providers.windows]
    global = false

    [shell.panel]
    clipboard_placement = "attached"
    launcher_placement = "attached"
    transparency_mode = "glass"
    wallpaper_placement = "floating"
    wallpaper_position = "center"

    [shell.screen_corners]
    enabled = true

    [shell.session]
    grid = true

        [[shell.session.actions]]
        action = "lock"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "1"
        variant = "default"

        [[shell.session.actions]]
        action = "logout"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "2"
        variant = "default"

        [[shell.session.actions]]
        action = "command"
        command = "systemctl --user restart niri.service"
        countdown_seconds = 0.0
        enabled = true
        glyph = "reload"
        label = "Restart niri"
        shortcut = "3"
        variant = "default"

        [[shell.session.actions]]
        action = "lock_and_suspend"
        countdown_seconds = 0.0
        enabled = false
        shortcut = "3"
        variant = "default"

        [[shell.session.actions]]
        action = "shutdown"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "4"
        variant = "destructive"

        [[shell.session.actions]]
        action = "reboot"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "5"
        variant = "primary"

        [[shell.session.actions]]
        action = "command"
        command = "pkexec /usr/local/bin/reboot-to-windows"
        countdown_seconds = 0.0
        enabled = true
        glyph = "brand-windows"
        label = "Reboot to Windows"
        shortcut = "6"
        variant = "secondary"

    [shell.shadow]
    alpha = 0.59999998658895493

[theme]
builtin = "Catppuccin"
community_palette = "Catppuccin Mocha Mauve-Lavender"
pure_black_dark = true
source = "builtin"

[wallpaper]
directory = "~/Pictures/Wallpapers"
transition_on_startup = true

    [wallpaper.default]
    path = "/home/willybarret/Pictures/Wallpapers/default.png"

    [wallpaper.last]
    path = "/home/willybarret/Pictures/Wallpapers/default.png"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/willybarret/Pictures/Wallpapers/default.png"

    [wallpaper.monitors.HDMI-A-3]
    path = "/home/willybarret/Pictures/Wallpapers/default.png"

    [wallpaper.monitors.sunshine]
    path = "/home/willybarret/Pictures/Wallpapers/default.png"

[weather]
enabled = false

[widget.audio_visualizer]
anchor = true
bands = 32
color_1 = "tertiary"
show_when_idle = true
width = 128

    [widget.audio_visualizer.actions]
    back = "media previous"
    forward = "media next"
    left = "panel-toggle control-center media"
    right = "media toggle"

[widget.cat]
audio_spectrum = true
scale = 1.5
tappy_mode = true
type = "noctalia/bongocat:cat"

[widget.cpu]
enabled = false

[widget.date]
format = "{:%a %d %b} {:%H:%M}"

[widget.launcher]
enabled = false

[widget.ram]
enabled = false
stat = "ram_pct"

[widget.status]
scale = 1.25
type = "icefish/phone-operate:status"

[widget.temp]
enabled = false

[widget.tray]
drawer = false

[widget.wallpaper]
enabled = false

[widget.workspaces]
style = "minimal"
